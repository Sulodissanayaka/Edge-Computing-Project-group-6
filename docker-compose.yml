services:
  backend:
    build:
      context: ./backend
    environment:
      CAMERA_SOURCE: ${CAMERA_SOURCE:-0}
      MODEL_PATH: /app/models/classroom_person.onnx
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8010:8000"
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_API: "true"
        VITE_API_BASE_URL: http://localhost:8010
        VITE_API_POLL_MS: "200"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  backend-uploads:
